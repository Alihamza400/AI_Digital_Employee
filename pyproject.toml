[project]
name = "hackathon0"
version = "0.1.0"
description = "Personal AI Employee - Hackathon 0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-api-python-client>=2.198.0",
    "google-auth>=2.55.1",
    "google-auth-oauthlib>=1.2.0",
    "playwright>=1.60.0",
    "python-dotenv>=1.2.2",
    "watchdog>=6.0.0",
    "httpx>=0.27.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "jinja2>=3.1.0",
    "fpdf2>=2.8.0",
    "croniter>=2.0.0",
    "apscheduler>=3.10.0",
    "cryptography>=42.0.0",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "ruff>=0.15.20",
    "pytest>=8.2.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"