[project]
name = "ai-digital-employee"
version = "1.0.0"
description = "Autonomous AI employee — monitors email, WhatsApp, LinkedIn, reasons with LLMs, and executes actions with human approval"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Ali Hamza", email = "raialihamza58@gmail.com"},
]
keywords = ["ai-agent", "automation", "gmail", "whatsapp", "linkedin", "opencode"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Office Suites",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "google-api-python-client>=2.198.0",
    "google-auth>=2.55.1",
    "google-auth-oauthlib>=1.2.0",
    "playwright>=1.60.0",
    "python-dotenv>=1.2.2",
    "watchdog>=6.0.0",
    "httpx>=0.27.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "jinja2>=3.1.0",
    "fpdf2>=2.8.0",
    "croniter>=2.0.0",
    "apscheduler>=3.10.0",
    "cryptography>=42.0.0",
]

[project.urls]
Homepage = "https://github.com/Alihamza400/AI_Digital_Employee"
Repository = "https://github.com/Alihamza400/AI_Digital_Employee"
Documentation = "https://github.com/Alihamza400/AI_Digital_Employee"

[project.scripts]
ai-employee = "main:main"

[dependency-groups]
dev = [
    "black>=26.5.1",
    "ruff>=0.15.20",
    "pytest>=8.2.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"
